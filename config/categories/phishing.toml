# Kategori: Phishing, Tiruan Login & Penipuan Kredensial Finansial

[meta]
enabled = true
label = "Phishing & Penipuan Kredensial"
min_pillars = 3
min_illegal_score = 8
veto_legal_threshold = 5

[queries]
brands = ["bri", "bca", "mandiri", "bni", "dana", "ovo", "gopay", "bpjs", "pln", "posindonesia"]
fillers = ["dana kaget", "klaim hadiah", "aktivasi tarif", "perubahan tarif", "verifikasi akun", "bansos resmi"]
plain = [
  "link klaim dana kaget hari ini resmi",
  "formulir perubahan tarif transaksi bank bri",
  "cek penerima bansos kemensos daftar online",
  "aktivasi ulang m-banking terblokir",
]
templates = [
  "link {t} resmi {year}",
  "formulir {t} online",
]

[pillar_domain]
domain_hints = [
  "danakaget", "klaim-hadiah", "tarif-baru", "aktivasi-akun", "verifikasi-id",
  "bansos-resmi", "e-tilang", "kurir-paket", "brimo-", "mybca-", "livin-",
]
high_risk_tlds = [".xyz", ".site", ".online", ".top", ".icu", ".vip", ".cfd", ".sbs", ".my.id", ".web.id", ".biz.id"]
mirror_patterns = ["(?:bri|bca|bni|mandiri|dana|ovo|pln|bpjs|kemensos)[a-z0-9-]{2,}"]

[pillar_semantics]
active_intent = [
  "klaim dana kaget", "masukkan nomor hp", "masukkan pin", "kode otp",
  "perubahan tarif transaksi", "setuju tarif lama", "akun anda terblokir",
  "verifikasi data sekarang", "klaim saldo gratis", "hadiah undian resmi",
]
passive_context = [
  "waspada penipuan", "modus phishing", "imbauan resmi bank", "edukasi keamanan siber",
  "jangan bagikan kode otp", "call center resmi", "berita penipuan online",
]

[pillar_anatomy]
url_path_patterns = [
  "/(?:login|verify|verifikasi|otp|pin|klaim|claim|tarif|aktivasi)",
]
dom_signatures = [
  'type="password"', "masukkan pin", "kode otp", "nomor kartu atm", "cvv",
  "masa berlaku kartu", "saldo terakhir", "username internet banking",
  "nomor handphone terdaftar", "lanjutkan verifikasi",
]
ad_network_markers = [
  "api.telegram.org/bot", "wa.me/", "t.me/",
]

[pillar_ecosystem]
outbound_ratio_threshold = 0.30
suspect_outbound_hints = ["api.telegram.org", "wa.me", "t.me", "bit.ly", "s.id"]
