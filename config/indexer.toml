[run]
workers = 12
time_budget_seconds = 3300
queries_per_run = 65
mirror_queries_per_run = 35
search_pages = 2
query_repeat_days = 7
fetch_timeout = 10
body_max_bytes = 350000
per_host_delay = 1.2
revisit_days = 30
dead_revisit_days = 14
veto_revisit_days = 90
frontier_max = 30000
index_max = 60000
export_max = 40000
trash_flush_lines = 15000
adaptive_probe = true

[engines]
language = "id"
auto_discover = true
discover_count = 6
probe_limit = 24
max_latency = 2.5
cache_path = ".cache/webindex/searx_space_verified.json"
cache_ttl = 21600
soft_gap = 0.8
max_empty_tries = 3
searxng = [
  "https://searx.be",
  "https://paulgo.io",
  "https://priv.au",
]
fallback = ["ddg_html", "mojeek", "bing_html"]

[engines.templates]
ddg_html = "https://html.duckduckgo.com/html/?q={q}&kl=id-id"
mojeek = "https://www.mojeek.com/search?q={q}&s={offset1}"
bing_html = "https://www.bing.com/search?q={q}&first={offset1}&setlang={lang}"

[domain_rules]
multi_tlds = [
  "co.id", "or.id", "ac.id", "go.id", "web.id", "sch.id", "mil.id", "net.id",
  "co.uk", "org.uk", "gov.uk", "ac.uk", "com.au", "net.au", "org.au", "gov.au",
  "co.jp", "ne.jp", "or.jp", "go.jp", "co.kr", "or.kr", "go.kr",
  "com.sg", "com.my", "com.br", "com.cn", "com.tw", "com.hk",
]

# Domain raksasa / infrastruktur yang bukan target individual Indexer
allowlist_domains = [
  "google.com", "youtube.com", "youtu.be", "googleapis.com", "gstatic.com",
  "facebook.com", "instagram.com", "twitter.com", "x.com", "tiktok.com",
  "reddit.com", "redd.it", "t.me", "telegram.org", "whatsapp.com", "discord.com",
  "github.com", "gitlab.com", "wikipedia.org", "wikimedia.org",
  "apple.com", "microsoft.com", "amazon.com", "cloudflare.com",
  "shopee.co.id", "tokopedia.com", "lazada.co.id", "blibli.com", "bukalapak.com",
]

shorteners = [
  "bit.ly", "tinyurl.com", "s.id", "cutt.ly", "rebrand.ly", "t.co",
  "goo.gl", "ow.ly", "is.gd", "buff.ly", "shorturl.at", "linktr.ee",
]

parked_hints = [
  "buy this domain", "domain is for sale", "this domain may be for sale",
  "sedoparking", "bodis.com", "dan.com", "afternic", "hugedomains",
  "parked free", "domain expired", "coming soon", "under construction",
  "apache2 ubuntu default page", "welcome to nginx",
]

mirror_templates = [
  "{b} link alternatif",
  "{b} terbaru",
  "situs mirip {b}",
  "{b} login",
  "{b} sub indo",
]
