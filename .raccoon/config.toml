[router]
mode = "adaptive-learning"
auto_route = true
auto_threshold = 0.85
review_threshold = 0.60
recursive_scan = true
max_file_bytes = 2000000

[history]
retention_days = 30
auto_cleanup = true
require_commit = true
require_validation = true
preserve_failed_changes = true

[history.protection]
keep_marker = true
pin_support = true
