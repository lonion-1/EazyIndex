name: Front-Gate Web Indexer (Tier 1)
# Copyright (c) 2026 EazyWhale (https://github.com/lonion-1)
# Licensed under the MIT

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Durasi maksimal (menit)'
        type: string
        default: '120'
      cats:
        description: 'Batasi kategori (koma, mis. comic,film,judol). Kosong = semua'
        type: string
        default: ''
      dry_run:
        description: 'Dry-run (tidak menulis file apa pun)'
        type: boolean
        default: false
  schedule:
    - cron: '40 17 */2 * *'

permissions:
  contents: write

concurrency:
  group: frontgate-webindex
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Ambil isi repo
        uses: actions/checkout@v4

      - name: Ambil konfigurasi privat dari EazyVault
        if: ${{ secrets.EAZYVAULT_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: lonion-1/EazyVault
          token: ${{ secrets.EAZYVAULT_TOKEN }}
          path: _vault

      - name: Pasang Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Pasang dependensi Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Siapkan Konfigurasi dari EazyVault
        run: |
          mkdir -p config/*.toml
          if [ -d "config.example" ]; then
            cp -rn config.example/* config/ 2>/dev/null || cp -r config.example/* config/
          fi

          VAULT_CFG=""
          if [ -d "_vault/config" ]; then
            VAULT_CFG="_vault/config"
          elif [ -d "_vault/_config" ]; then
            VAULT_CFG="_vault/_config"
          fi

          if [ -n "$VAULT_CFG" ]; then
            echo "[INFO] Memuat konfigurasi dari $VAULT_CFG"
            cp -rf "$VAULT_CFG"/* config/
            for f in "$VAULT_CFG"/*.toml; do
              [ -e "$f" ] || continue
              base="$(basename "$f")"
              case "$base" in
                indexer.toml|legal_profiles.toml|engines.toml|auto_suggest.toml|auto_learned.toml)
                  ;;
                *)
                  cp -f "$f" "config/categories/$base"
                  ;;
              esac
            done
          else
            echo "[WARN] Folder _vault/config tidak ditemukan, memakai config.example/"
          fi

          # Bersihkan _vault segera setelah semua TOML tersalin rapi ke config/
          rm -rf _vault

      - name: Pulihkan cache indeks (frontier, seen, vetoed_benign, feed query, searx)
        uses: actions/cache/restore@v4
        with:
          path: .cache/webindex
          key: webindex-${{ github.run_id }}
          restore-keys: webindex-

      - name: Autocomplete Queries Suggest
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          CATS: ${{ inputs.cats }}
        run: |
          ARGS=()
          shopt -s nullglob
          TOML_FILES=(config/auto_suggest.toml)
          if [ ${#TOML_FILES[@]} -gt 0 ]; then
            ARGS+=(--queries "${TOML_FILES[@]}")
          fi
          if [ -n "$CATS" ]; then
            ARGS+=(--cats "$CATS")
          fi
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi

          echo "[START] Menjalankan indexer.harvest.auto_seed..."
          python3 -u -m indexer.harvest.auto_seed "${ARGS[@]}"

      - name: Jalankan Front-Gate Web Indexer
        env:
          MINS: ${{ inputs.minutes }}
          CATS: ${{ inputs.cats }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          BUDGET_MINS="${MINS:-120}"
          ARGS=(--budget "$(( BUDGET_MINS * 60 ))")

          shopt -s nullglob
          TOML_FILES=(config/* config/*.toml)
          if [ ${#TOML_FILES[@]} -gt 0 ]; then
            ARGS+=(--queries "${TOML_FILES[@]}")
          fi
          if [ -n "$CATS" ]; then
            ARGS+=(--cats "$CATS")
          fi
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi

          echo "[START] Menjalankan scripts.web_indexer (budget: ${BUDGET_MINS}m)..."
          python3 -u -m scripts.web_indexer "${ARGS[@]}"

      - name: Simpan cache indeks
        if: always() && inputs.dry_run != true
        uses: actions/cache/save@v4
        with:
          path: .cache/webindex
          key: webindex-${{ github.run_id }}

      - name: Simpan kandidat ke GitHub
        if: inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3; do
            git fetch origin "$BRANCH"
            git reset --soft "origin/$BRANCH"
            git reset HEAD -- .
            git add Candidates

            if git diff --staged --quiet; then
              echo "Tidak ada kandidat baru."
              exit 0
            fi

            git commit -m "chore(indexer): perbarui kandidat Front-Gate [skip ci]"
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
