name: Front-Gate Web Indexer (Tier 1)
# Copyright (c) 2026 EazyWhale (https://github.com/lonion-1)
# Licensed under the MIT

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Durasi maksimal (menit)'
        type: string
        default: '120'
      cats:
        description: 'Batasi kategori (koma, mis. comic,film,judol). Kosong = semua'
        type: string
        default: ''
      dry_run:
        description: 'Dry-run (tidak menulis file apa pun)'
        type: boolean
        default: false
  schedule:
    - cron: '40 17 */2 * *'

permissions:
  contents: write

concurrency:
  group: frontgate-webindex
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Ambil isi repo
        uses: actions/checkout@v4

      - name: Cek ketersediaan token EazyVault
        id: vault_check
        env:
          VAULT_TOKEN: ${{ secrets.EAZYVAULT_TOKEN }}
        run: |
          if [ -n "$VAULT_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ambil konfigurasi privat dari EazyVault
        if: steps.vault_check.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          repository: lonion-1/EazyVault
          token: ${{ secrets.EAZYVAULT_TOKEN }}
          path: _vault

      - name: Pasang Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Pasang dependensi Python
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi

      - name: Siapkan Konfigurasi dari EazyVault
        run: |
          mkdir -p config config/categories

          for tpl_dir in config.example config_example example_config examples templates _config; do
            if [ -d "$tpl_dir" ]; then
              cp -rn "$tpl_dir"/* config/ 2>/dev/null || cp -r "$tpl_dir"/* config/
            fi
          done

          for ex in config/*.example.toml *.example.toml; do
            [ -e "$ex" ] || continue
            target_name="$(basename "$ex" .example.toml).toml"
            [ -f "config/$target_name" ] || cp -f "$ex" "config/$target_name"
          done

          for vdir in "_vault" "_vault/config" "_vault/_config"; do
            [ -d "$vdir" ] || continue
            if [ -d "$vdir/categories" ]; then
              cp -rf "$vdir/categories/"*.toml config/categories/ 2>/dev/null || true
            fi
            for f in "$vdir"/*.toml; do
              [ -e "$f" ] || continue
              base="$(basename "$f")"
              case "$base" in
                film.toml|porn.toml|comic.toml|anime.toml|judol.toml|scam.toml|warez.toml|sport.toml|pinjol.toml|phishing.toml|forum.toml)
                  cp -f "$f" "config/categories/$base"
                  ;;
                *)
                  cp -f "$f" "config/$base"
                  ;;
              esac
            done
          done

          rm -rf _vault

          if [ ! -f "config/indexer.toml" ]; then
            FOUND_INDEXER=$(find . -maxdepth 3 -name "indexer*.toml" | head -n 1)
            if [ -n "$FOUND_INDEXER" ]; then
              cp -f "$FOUND_INDEXER" config/indexer.toml
            else
              echo "[ERROR] config/indexer.toml tidak ditemukan!"
              exit 1
            fi
          fi

          echo "[INFO] Isi config/: $(ls -1 config)"
          echo "[INFO] Isi config/categories/: $(ls -1 config/categories)"


      - name: Pulihkan cache indeks
        uses: actions/cache/restore@v4
        with:
          path: .cache/webindex
          key: webindex-v2-${{ github.run_id }}
          restore-keys: webindex-v2-

      - name: Pastikan direktori cache valid
        run: |
          if [ -e ".cache/webindex" ] && [ ! -d ".cache/webindex" ]; then
            echo "[WARN] .cache/webindex berupa file, menghapus..."
            rm -f ".cache/webindex"
          fi
          mkdir -p .cache/webindex

      - name: Autocomplete Queries Suggest
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          CATS: ${{ inputs.cats }}
        run: |
          ARGS=(--config-dir config)

          if [ -n "$CATS" ]; then
            ARGS+=(--cats "$CATS")
          fi
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi

          echo "[START] Menjalankan indexer.harvest.auto_seed..."
          python3 -u -m indexer.harvest.auto_seed "${ARGS[@]}"

      - name: Jalankan Front-Gate Web Indexer
        env:
          MINS: ${{ inputs.minutes }}
          CATS: ${{ inputs.cats }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          BUDGET_MINS="${MINS:-120}"
          ARGS=(--budget "$(( BUDGET_MINS * 60 ))" --skip-suggest)

          if [ -n "$CATS" ]; then
            ARGS+=(--cats "$CATS")
          fi
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi

          echo "[START] Menjalankan scripts.web_indexer (budget: ${BUDGET_MINS}m)..."
          python3 -u -m scripts.web_indexer "${ARGS[@]}"
          
      - name: Simpan cache indeks
        if: always() && !inputs.dry_run
        uses: actions/cache/save@v4
        with:
          path: .cache/webindex
          key: webindex-v2-${{ github.run_id }}

      - name: Simpan kandidat ke GitHub
        if: ${{ !inputs.dry_run }}
        run: |
          if [ ! -d "Candidates" ]; then
            echo "[INFO] Folder Candidates tidak ditemukan, tidak ada yang di-commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3; do
            git fetch origin "$BRANCH"
            git reset --soft "origin/$BRANCH"
            git reset HEAD -- .
            git add Candidates

            if git diff --staged --quiet; then
              echo "Tidak ada kandidat baru."
              exit 0
            fi

            git commit -m "chore(indexer): perbarui kandidat Front-Gate [skip ci]"
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
