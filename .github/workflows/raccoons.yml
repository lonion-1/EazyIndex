name: Raccoons Service (Adaptive Dropzone Router)

on:
  push:
    branches: [main, master, blocker]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      approve_file:
        description: "Filename in _dropzone/_review to approve for future routing learning"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: raccoons-${{ github.ref }}
  cancel-in-progress: false

jobs:
  raccoon-service:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Raccoon safety tests
        run: python -m unittest discover -s tests -p 'test_raccoon_*.py' -v
      - name: Route dropzone and validate syntax
        env:
          RACCOON_APPROVE_FILE: ${{ inputs.approve_file }}
        run: python -m scripts.raccoon_service
      - name: Ruff diagnostics (non-mutating)
        run: |
          python -m pip install --quiet ruff
          ruff check . --output-format=github --exit-zero
      - name: Save Raccoons changes
        if: success() && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Raccoons changes to commit."
            exit 0
          fi
          git commit -m "chore(raccoons): adaptive route and validated cleanup [skip ci]"
          git push
